spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: chat-api
              uri: ${CHAT_API_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/**

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

